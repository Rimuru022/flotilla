[project]
name = "flotilla"
version = "0.1.0"
description = "Rentabilidad, cartera y cotizaciones para una arrendadora de vehículos, con asistente de IA y servidor MCP."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openai>=1.40",
    "mcp>=1.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
